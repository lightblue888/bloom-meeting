<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111112">
<title>Bloom 会议</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'%3E%3Cg transform='translate(120,120)'%3E%3Cellipse cy='-46' rx='22' ry='40' fill='%233B82F6'/%3E%3Cellipse cy='-46' rx='22' ry='40' fill='%2360A5FA' transform='rotate(72)'/%3E%3Cellipse cy='-46' rx='22' ry='40' fill='%233B82F6' transform='rotate(144)'/%3E%3Cellipse cy='-46' rx='22' ry='40' fill='%2360A5FA' transform='rotate(216)'/%3E%3Cellipse cy='-46' rx='22' ry='40' fill='%233B82F6' transform='rotate(288)'/%3E%3Ccircle r='26' fill='%231D4ED8'/%3E%3Ccircle r='9' fill='%23EFF6FF'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#111112;--panel:#18181a;--panel-2:#1f1f22;--panel-3:#29292d;
  --line:rgba(var(--wash-rgb),.07);--line-2:rgba(var(--wash-rgb),.12);
  --ink:#f2f1ee;--ink-2:#cfcdc8;--mute:#9a9893;--faint:#64625e;
  --bloom:#3b82f6;--bloom-2:#60a5fa;--bloom-deep:#1d4ed8;--claude:#d97757;
  --ok:#4ade80;--bad:#f87171;--warn:#fbbf24;
  --r:12px;
  --wash-rgb:255,255,255;--toast:#2a2a2e;--glass:rgba(24,24,26,.92);--soft-blue:#93c5fd;--soft-red:#fca5a5;--shadow:rgba(0,0,0,.45);
  --cc-k:0%;--cc-h:107px;
}
:root[data-theme="light"]{
  --bg:#f7f6f3;--panel:#ffffff;--panel-2:#f1efea;--panel-3:#e6e3dc;
  --line:rgba(0,0,0,.07);--line-2:rgba(0,0,0,.13);
  --ink:#1b1a18;--ink-2:#3b3935;--mute:#6d6a64;--faint:#a29e96;
  --bloom:#2563eb;--bloom-2:#3b82f6;--bloom-deep:#1d4ed8;--claude:#c2410c;
  --ok:#16a34a;--bad:#dc2626;--warn:#b45309;
  --wash-rgb:0,0,0;--toast:#ffffff;--glass:rgba(var(--wash-rgb),.9);--soft-blue:#1d4ed8;--soft-red:#b91c1c;--shadow:rgba(0,0,0,.14);
  --cc-k:40%;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f7f6f3;--panel:#ffffff;--panel-2:#f1efea;--panel-3:#e6e3dc;
    --line:rgba(0,0,0,.07);--line-2:rgba(0,0,0,.13);
    --ink:#1b1a18;--ink-2:#3b3935;--mute:#6d6a64;--faint:#a29e96;
    --bloom:#2563eb;--bloom-2:#3b82f6;--bloom-deep:#1d4ed8;--claude:#c2410c;
    --ok:#16a34a;--bad:#dc2626;--warn:#b45309;
    --wash-rgb:0,0,0;--toast:#ffffff;--glass:rgba(var(--wash-rgb),.9);--soft-blue:#1d4ed8;--soft-red:#b91c1c;--shadow:rgba(0,0,0,.14);
    --cc-k:40%;
  }
}
*{box-sizing:border-box}
#r-mic .lvl{display:none;align-items:flex-end;gap:2px;height:14px;margin-left:1px}
#r-mic:not(.off) .lvl{display:inline-flex}
#r-mic .lvl i{width:3px;border-radius:2px;background:var(--ok);height:calc(3px + 11px * var(--lv,0));transition:height .07s linear}
#r-mic .lvl i:nth-child(2){height:calc(3px + 11px * min(1, var(--lv,0) * 1.45))}
#r-mic .lvl i:nth-child(3){height:calc(3px + 11px * var(--lv,0) * .65)}
#r-theme svg .sun{display:none}
:root[data-theme="light"] #r-theme svg .sun{display:inline}
:root[data-theme="light"] #r-theme svg .moon{display:none}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) #r-theme svg .sun{display:inline}:root:not([data-theme="dark"]) #r-theme svg .moon{display:none}}
.paper iframe.staging{visibility:hidden}
html,body{height:100%;margin:0}
body{transition:background-color .25s,color .25s;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mark{display:block;flex:none}

/* ---------- 进会 ---------- */
#join{min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px 16px;
  background:radial-gradient(1000px 520px at 50% -18%,rgba(59,130,246,.16),transparent 62%),var(--bg)}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:0 1px 0 rgba(var(--wash-rgb),.04) inset,0 40px 90px -20px rgba(0,0,0,.6)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:500;
  background:rgba(var(--wash-rgb),.06);color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{background:rgba(59,130,246,.15);color:var(--soft-blue)}
.pill.live i{box-shadow:0 0 0 3px rgba(59,130,246,.22);animation:pulse 2s infinite}
.pill.wait{background:rgba(96,165,250,.12);color:var(--bloom-2)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(59,130,246,.05)}}
.card-bd{padding:24px 22px 22px}
.card h1{margin:0;font-size:22px;line-height:1.32;font-weight:680;letter-spacing:.005em;word-break:break-word}
.sub{margin-top:6px;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 10px;margin:0 -10px;border-radius:12px}
.prow .nm{min-width:0;flex:1}
.prow .nm b{display:block;font-weight:600;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm span{display:block;font-size:12px;color:var(--mute);line-height:1.45;white-space:pre-line}
.kv{list-style:none;margin:2px 0 8px 48px;padding:10px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--mute);white-space:nowrap}
.kv dd{margin:0;color:var(--ink-2);word-break:break-word}
.chip{flex:none;font-size:11.5px;font-weight:550;line-height:1;padding:5px 8px;border-radius:7px;background:rgba(var(--wash-rgb),.06);color:var(--ink-2)}
.chip.host{background:rgba(59,130,246,.16);color:var(--soft-blue)}
.chip.claude{background:rgba(217,119,87,.16);color:#f0a585}
.av{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:650;color:#fff;background:#3f3f46;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.flower{background:#26262a;padding:3px}
.av.sm{width:28px;height:28px;font-size:12px}
.speaking .av{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--bloom-2)}
/* 谁在说话：浮在论文上方正中，一行小字，没人说话就淡出 */
.talking{position:absolute;top:10px;left:50%;z-index:5;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;max-width:86%;
  padding:5px 12px 5px 6px;border-radius:999px;background:var(--glass);border:1px solid rgba(96,165,250,.35);
  box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:12.5px;color:var(--ink-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.talking.on{opacity:1;transform:translate(-50%,0)}
.backhost{position:absolute;left:50%;bottom:18px;z-index:5;transform:translateX(-50%);height:36px;padding:0 16px;border:0;border-radius:18px;
  background:var(--bloom);color:#fff;font-size:13px;font-weight:600;box-shadow:0 10px 24px -6px rgba(59,130,246,.55);
  padding-bottom:env(safe-area-inset-bottom)}
.backhost:active{transform:translateX(-50%) translateY(1px)}
.talking .av{width:22px;height:22px;font-size:10px;box-shadow:0 0 0 2px rgba(96,165,250,.55)}
.talking b{font-weight:600}
/* 语音连接状态：论文上方正中（手机上侧栏收着，放侧栏里看不到） */
.conn{position:absolute;top:10px;left:50%;z-index:6;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  width:max-content;max-width:calc(100% - 24px);padding:6px 12px;border-radius:18px;background:var(--toast);border:1px solid rgba(251,191,36,.45);
  box-shadow:0 8px 24px var(--shadow);font-size:12.5px;line-height:1.4;color:var(--ink)}
.conn.retry{padding-right:6px}
.conn .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.conn.busy .dot{width:12px;height:12px;background:none;border:2px solid rgba(251,191,36,.3);border-top-color:var(--warn);animation:spin .9s linear infinite}
.conn .tx{min-width:0}
.conn button{flex:none;height:28px;padding:0 12px;border:0;border-radius:14px;background:var(--bloom);color:#fff;font-size:12.5px;font-weight:600}
.paper.conn-on .talking{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* 在微信 / QQ 这类 App 里打开：提醒换浏览器（不挡进会） */
.inapp{display:flex;align-items:flex-start;gap:10px;margin:0 0 18px;padding:10px 6px 10px 12px;border-radius:12px;
  background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.32);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.inapp .ic{flex:none;margin-top:2px;color:var(--warn)}
.inapp .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.inapp .copy{display:block;margin-top:7px;height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:12px}
.inapp .x{flex:none;width:28px;height:28px;margin-top:-4px;border:0;border-radius:14px;background:transparent;color:var(--mute);font-size:18px;line-height:28px;padding:0}
.inapp .x:hover{background:rgba(var(--wash-rgb),.06)}
.form{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em}
.field input{width:100%;height:46px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel-2);
  color:var(--ink);font:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:var(--faint)}
.field input:focus{border-color:rgba(96,165,250,.75);box-shadow:0 0 0 4px rgba(59,130,246,.16)}
.toggle-row{display:flex;align-items:center;gap:12px;height:50px;padding:0 12px 0 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel-2);cursor:pointer;user-select:none}
.toggle-row .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--panel-3);color:var(--ink-2);flex:none}
.toggle-row .tx{flex:1;min-width:0;line-height:1.3}
.toggle-row .tx b{display:block;font-weight:550;font-size:14px}
.toggle-row .tx span{font-size:12px;color:var(--mute)}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch .tr{position:absolute;inset:0;border-radius:999px;background:#3a3a3f;transition:background .18s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .18s cubic-bezier(.3,1.3,.5,1)}
.switch input:checked + .tr{background:var(--bloom)}
.switch input:checked + .tr::after{transform:translateX(16px)}
.switch input:focus-visible + .tr{box-shadow:0 0 0 3px rgba(59,130,246,.35)}
.primary{height:48px;margin-top:4px;border:0;border-radius:var(--r);background:var(--bloom);color:#fff;font-weight:600;font-size:15px;letter-spacing:.02em;
  box-shadow:0 10px 24px -8px rgba(59,130,246,.55);transition:background .15s,transform .05s}
.primary:hover{background:#4a8df8}
.primary:active{transform:translateY(1px)}
.primary:disabled{opacity:.55;cursor:default;box-shadow:none}
.err{margin:0;color:var(--bad);font-size:12.5px;min-height:1.2em}
.state-box{margin-top:22px;display:flex;gap:12px;align-items:center;padding:16px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.state-box .ic{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel-3);color:var(--ink-2)}
.state-box b{display:block;font-size:14.5px;font-weight:600}
.state-box p{margin:3px 0 0;font-size:13px;color:var(--mute);line-height:1.55}
.foot{padding:12px 22px 16px;color:var(--faint);font-size:12px;text-align:center}

/* ---------- 会中 ---------- */
#room{height:100%;display:flex;flex-direction:column}
.top{flex:none;height:60px;display:flex;align-items:center;gap:12px;padding:0 14px 0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .t{min-width:0;flex:1;display:flex;align-items:center;gap:12px}
.top .name{min-width:48px}
.top .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 会议名：顶栏放不下就省略，点一下在顶栏下面展开完整的名字（再点一下、点别处、Esc 收起） */
.top button.name{flex:0 1 auto;display:inline-flex;align-items:center;gap:4px;max-width:100%;height:36px;margin:0 -6px;padding:0 6px;border:0;border-radius:9px;
  background:transparent;color:var(--ink);text-align:left;transition:background-color .15s}
.top button.name:hover{background:rgba(var(--wash-rgb),.05)}
.top button.name:active{background:rgba(var(--wash-rgb),.09)}
.top button.name:focus-visible{outline:2px solid var(--bloom-2);outline-offset:1px}
.top button.name .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button.name .chev{flex:none;display:none;color:var(--mute);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.top button.name.trunc .chev,.top button.name[aria-expanded="true"] .chev{display:block}
.top button.name[aria-expanded="true"] .chev{transform:rotate(180deg)}
.title-pop{position:fixed;z-index:46;left:max(10px,calc(50% - 280px));right:max(10px,calc(50% - 280px));top:66px;
  padding:clamp(14px,2.2vmax,20px) clamp(16px,2.6vmax,22px) clamp(14px,2vmax,18px);border-radius:16px;background:var(--panel);border:1px solid var(--line-2);
  box-shadow:0 22px 48px -12px var(--shadow),0 1px 0 rgba(var(--wash-rgb),.04) inset;
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:50% 0;pointer-events:none;
  transition:opacity .18s ease,transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear .24s}
.title-pop.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .18s ease,transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s}
.title-pop .tp-k{font-size:clamp(11.5px,1.6vmax,13px);font-weight:600;letter-spacing:.04em;color:var(--mute)}
.title-pop .tp-t{margin-top:6px;font-size:clamp(17px,2.6vmax,22px);line-height:1.42;font-weight:650;color:var(--ink);overflow-wrap:anywhere;
  max-height:calc(100vh - 180px);max-height:calc(100dvh - 180px);overflow:auto}
.title-pop .tp-sub{margin-top:8px;font-size:clamp(12.5px,1.8vmax,14px);line-height:1.5;color:var(--mute);font-variant-numeric:tabular-nums}
.title-pop .tp-sub:empty{display:none}
/* 展开时论文上蒙一层：点论文（它在 iframe 里，点击传不到这一页）也能收起 */
.title-scrim{position:fixed;left:0;right:0;bottom:0;top:60px;z-index:45;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .2s ease}
:root[data-theme="light"] .title-scrim{background:rgba(0,0,0,.16)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .title-scrim{background:rgba(0,0,0,.16)}}
.title-scrim.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.title-pop,.title-pop.on,.top button.name .chev,.title-scrim{transition:none}}
.cbtn{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--ink-2);font-size:13px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.cbtn:hover{background:var(--panel-3);color:var(--ink)}
.cbtn.off{color:var(--soft-red);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}
.cbtn.icon{width:38px;padding:0;justify-content:center}
.cbtn.leave{background:#c2413b;border-color:#c2413b;color:#fff}
.cbtn.leave:hover{background:#d14b44}
.main{flex:1;min-height:0;display:flex}
.stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.paper{flex:1;min-width:0;min-height:0;position:relative;background:var(--bg)}
/* 字幕：论文下面一条（不盖论文、不盖按钮），最近三句；最新那句最多两行、太长留结尾，前两句各一行 */
.cbtn.on{background:rgba(59,130,246,.14);border-color:rgba(96,165,250,.45);color:var(--soft-blue)}
.cbtn.on:hover{background:rgba(59,130,246,.2);color:var(--soft-blue)}
#r-cc .slash{display:none}
#r-cc:not(.on) .slash{display:inline}
.cc{flex:none;height:calc(var(--cc-h) + env(safe-area-inset-bottom));padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line);overflow:hidden}
.cc-in{max-width:880px;height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;min-width:0}
.cc-row{display:flex;align-items:flex-start;gap:10px;min-width:0;font-size:13px;line-height:20px;color:var(--mute)}
.cc-who{flex:none;max-width:7.5em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600;color:var(--ink-2)}
.cc-who.host{color:var(--soft-blue)}
.cc-who.claude{color:var(--claude)}
.cc-who.guest{color:var(--c);color:color-mix(in oklab,var(--c),#000 var(--cc-k))}
.cc-tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-row.now{font-size:15px;line-height:22px;color:var(--ink)}
.cc-row.now .cc-tx{white-space:normal;text-overflow:clip;max-height:44px;display:flex;flex-direction:column;justify-content:flex-end;overflow-wrap:anywhere}
.cc-row.now.clip .cc-tx{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px);mask-image:linear-gradient(to bottom,transparent 0,#000 16px)}
.cc-empty{font-size:13px;line-height:20px;color:var(--faint)}
body.cc-on .toast{bottom:calc(var(--cc-h) + 14px + env(safe-area-inset-bottom))}
.paper iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;color:var(--mute);font-size:13.5px;text-align:center}
.empty svg{opacity:.5}
.side{width:300px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.side-h{flex:none;padding:16px 18px 6px;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em}
.side-h .n{margin-left:6px;font-weight:500}
.pane{flex:1;min-height:0;overflow:auto;padding:4px 18px 18px;scrollbar-width:thin;scrollbar-color:rgba(var(--wash-rgb),.16) transparent}
.note{flex:none;padding:9px 14px;border-top:1px solid var(--line);color:var(--warn);font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--toast);border:1px solid var(--line-2);color:var(--ink);padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px var(--shadow);z-index:50}
.people-btn{display:none;height:38px;align-items:center;gap:6px;padding:0 10px 0 6px;border-radius:19px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.people-btn .stack{display:flex}
.people-btn .stack .av{width:24px;height:24px;font-size:11px;border:2px solid var(--panel-2);margin-left:-8px}
.people-btn .stack .av:first-child{margin-left:0}
.sheet-x{display:none;margin-left:auto;width:30px;height:30px;border:0;border-radius:15px;background:rgba(var(--wash-rgb),.06);color:var(--ink-2);font-size:18px;line-height:30px;padding:0}
.side-h{display:flex;align-items:center}
.scrim{display:none}
.prow.claude-row{cursor:pointer}
.prow .chev{flex:none;margin-left:-4px;color:var(--faint);transition:transform .18s ease}
.prow.claude-row.open .chev{transform:rotate(180deg)}
.grab{display:none}
@media (max-width:820px){
  .top{gap:6px;padding:0 8px 0 10px;height:56px}
  .top .t{gap:8px}
  .top .pill{padding:0 8px;height:24px}
  .cbtn.leave{padding:0 12px}
  .top .name{font-size:14.5px}
  .cbtn .lbl{display:none}
  .cbtn{padding:0 11px}
  .people-btn{display:inline-flex}
  .main{position:relative}
  .paper{flex:1;height:auto}
  .side{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:72vh;z-index:40;border:0;border-top:1px solid var(--line-2);
    border-radius:18px 18px 0 0;box-shadow:0 -18px 40px rgba(0,0,0,.5);transform:translateY(calc(100% + 64px));transition:transform .26s cubic-bezier(.2,.8,.2,1);
    padding-bottom:env(safe-area-inset-bottom)}
  .side.open{transform:none}
  .grab{display:block;width:36px;height:4px;border-radius:2px;background:rgba(var(--wash-rgb),.18);margin:8px auto 0}
  .side-h{padding:10px 16px 6px}
  .sheet-x{display:block}
  .scrim{display:block;position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  /* 手机字幕：区域和字号按屏幕取（2026-11-14：107px、15px 两行，看不清 AI 说了什么） */
  :root{--cc-h:clamp(150px,26vh,240px)}
  .cc-row{font-size:clamp(14px,2vmax,16px);line-height:1.5}
  .cc-row.now{font-size:clamp(17px,2.4vmax,21px);line-height:1.5}
  .cc-row.now .cc-tx{max-height:4.5em}
  .cc-empty{font-size:14px;line-height:1.5}
}
@media (max-height:500px){
  .top{height:44px}
  .top .pill{height:22px}
  .cbtn{height:32px}
  .cbtn.icon{width:32px}
  .people-btn{height:32px}
  .people-btn .stack .av{width:20px;height:20px}
  :root{--cc-h:clamp(84px,30vh,130px)}               /* 横着拿手机：字幕只留两句 */
  .cc-row:nth-last-child(n+3){display:none}
}
@media (max-width:440px){
  #join{padding:16px;align-items:flex-start}
  .card-hd{padding:16px 18px}
  .card-bd{padding:20px 18px 18px}
  /* 窄屏顶栏：会议中的计时只留一个亮点，名字先省略，不让参会人头像压住它 */
  #room .top .t{overflow:hidden}
  #room .top .pill.live{padding:0;width:22px;justify-content:center;flex:none}
  #room .top .pill.live #r-pill-t{display:none}
  #room .top .cbtn.icon{width:34px;padding:0}
  /* 多了字幕开关：按钮之间收紧一点，把位置让给会议名 */
  #room .top{gap:4px;padding:0 6px 0 9px}
  #room .top .t{gap:6px}
  #room .top .cbtn.icon{width:32px}
  #room .top #r-mic{padding:0 9px}
  #room .top .cbtn.leave{padding:0 10px}
  #room .top .people-btn{padding:0 8px 0 4px;gap:5px}
  .cc{padding-left:12px;padding-right:12px}
  .cc-row{gap:8px}
  .cc-who{max-width:6em}
}
</style>
</head>
<body>

<section id="join">
  <div class="card">
    <div class="card-hd">
      <div class="brand"><span class="mark-slot"></span>Bloom</div>
      <span class="pill" id="j-pill"><i></i><span id="j-pill-t">连接中</span></span>
    </div>
    <div class="card-bd">
      <div class="inapp hidden" id="j-inapp" role="note">
        <svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8l6.4 11.4H1.6z"/><path d="M8 6.4v3M8 11.4v.1"/></svg>
        <div class="tx"><span id="j-inapp-t"></span><button class="copy" id="j-inapp-copy">复制链接</button></div>
        <button class="x" id="j-inapp-x" aria-label="关闭提示">×</button>
      </div>
      <h1 id="j-topic">组会</h1>
      <div class="sub" id="j-sub"></div>
      <div class="sec" id="j-people-sec">
        <div class="sec-h">参会人<span id="j-n"></span></div>
        <ul class="plist" id="j-people"></ul>
      </div>
      <div class="form" id="j-form">
        <label class="field"><span class="sr">你的名字</span><input id="j-name" maxlength="32" autocomplete="name" placeholder="你的名字"></label>
        <label class="toggle-row" id="j-mic-row">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="5.5" y="1.8" width="5" height="8.4" rx="2.5"/><path d="M3.2 7.8a4.8 4.8 0 0 0 9.6 0M8 12.6v1.8"/></svg></span>
          <span class="tx"><b>进会时打开麦克风</b><span id="j-mic-t">大家能听到你</span></span>
          <span class="switch"><input type="checkbox" id="j-mic" aria-label="进会时打开麦克风"><span class="tr"></span></span>
        </label>
        <button class="primary" id="j-go">加入会议</button>
        <p class="err" id="j-err"></p>
      </div>
      <div class="state-box hidden" id="j-state">
        <span class="ic" id="j-state-ic"></span>
        <b id="j-state-b"></b>
      </div>
    </div>
  </div>
</section>

<section id="room" class="hidden">
  <header class="top">
    <div class="t">
      <span class="mark-slot"></span>
      <button class="name" id="r-topic" aria-expanded="false" aria-controls="r-title-pop"><span class="tx" id="r-topic-t">组会</span><svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.2l4 4 4-4"/></svg></button>
      <span class="pill" id="r-pill"><i></i><span id="r-pill-t">连接中</span></span>
    </div>
    <button class="people-btn" id="r-people" aria-label="参会人" aria-expanded="false"><span class="stack" id="r-stack"></span><span id="r-people-n"></span></button>
    <button class="cbtn off" id="r-mic"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="5.5" y="1.8" width="5" height="8.4" rx="2.5"/><path d="M3.2 7.8a4.8 4.8 0 0 0 9.6 0M8 12.6v1.8"/><path class="slash" d="M2.5 2.5l11 11"/></svg><span class="lbl" id="r-mic-l">已静音</span><span class="lvl" aria-hidden="true"><i></i><i></i><i></i></span></button>
    <button class="cbtn icon on" id="r-cc" aria-label="字幕" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="3" width="12.4" height="10" rx="2.2"/><path d="M4.6 8.1h2.4M9 8.1h2.4M4.6 10.5h6.8"/><path class="slash" d="M2.5 2.5l11 11"/></svg></button>
    <button class="cbtn icon" id="r-theme" aria-label="切换浅色 / 深色"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path class="moon" d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/><g class="sun"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M3.5 12.5l1-1M11.5 4.5l1-1"/></g></svg></button>
    <button class="cbtn icon hidden" id="r-audio" aria-label="开启声音"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 6v4h2.6L9 13V3L5.1 6z"/><path d="M11.4 5.6a3.4 3.4 0 0 1 0 4.8"/></svg></button>
    <button class="cbtn leave" id="r-leave">离开</button>
  </header>
  <div class="title-scrim" id="r-title-scrim" aria-hidden="true"></div>
  <div class="title-pop" id="r-title-pop" role="dialog" aria-label="会议名" aria-hidden="true">
    <div class="tp-k">会议名</div>
    <div class="tp-t" id="r-title-full"></div>
    <div class="tp-sub" id="r-title-sub"></div>
  </div>
  <div class="main">
   <div class="stage">
    <div class="paper">
      <iframe id="r-paper" title="论文" class="hidden"></iframe>
      <div class="talking" id="r-talking" aria-live="polite"></div>
      <div class="conn hidden" id="r-conn" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="tx" id="r-conn-t"></span><button class="hidden" id="r-conn-b">重新连接</button></div>
      <button class="backhost hidden" id="r-back">回到主持人位置</button>
      <div class="empty" id="r-paper-empty">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.8h8.2L19 7.6v13.6H6z"/><path d="M14 2.8v5h5M9 12h7M9 15.5h7"/></svg>
        <span id="r-paper-t"></span>
      </div>
    </div>
    <div class="cc hidden" id="r-cc-box" role="region" aria-label="实时字幕"><div class="cc-in" id="r-cc-in"></div></div>
   </div>
    <aside class="side" id="r-side">
      <div class="grab" aria-hidden="true"></div>
      <div class="side-h">参会人<span class="n" id="r-n"></span><button class="sheet-x" id="r-side-x" aria-label="关闭">×</button></div>
      <div class="pane"><ul class="plist" id="people"></ul></div>
    </aside>
    <div class="scrim" id="r-scrim"></div>
  </div>
</section>

<script src="/livekit-client.umd.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js'"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var SVGNS = 'http://www.w3.org/2000/svg';
  var qs = new URLSearchParams(location.search);
  // 房间号：短链接 /room/<房间号>，或者旧链接 ?room=<房间号>&role=guest（两种都认；不带 role 就是访客）
  var pathRoom = '', pm = location.pathname.match(/^\/room\/([^\/]+)\/?$/);
  if (pm) { try { pathRoom = decodeURIComponent(pm[1]); } catch (e) { pathRoom = pm[1]; } }
  var ROOM = (pathRoom || qs.get('room') || '').trim();
  var ROLE = ['teacher', 'guest'].indexOf(qs.get('role')) >= 0 ? qs.get('role') : 'guest';
  var state = null, sv = -1, pv = 0, room = null, started = null, joined = false, loaded = false;

  // Bloom 的标志：五片花瓣围着花心（和软件里同一个）
  function mark(size) {
    var s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 240 240');
    s.setAttribute('aria-hidden', 'true'); s.setAttribute('class', 'mark');
    var g = document.createElementNS(SVGNS, 'g'); g.setAttribute('transform', 'translate(120,120)');
    for (var k = 0; k < 5; k++) {
      var e = document.createElementNS(SVGNS, 'ellipse');
      e.setAttribute('cx', '0'); e.setAttribute('cy', '-46'); e.setAttribute('rx', '22'); e.setAttribute('ry', '40');
      e.setAttribute('fill', k % 2 === 0 ? '#3B82F6' : '#60A5FA'); e.setAttribute('transform', 'rotate(' + k * 72 + ')');
      g.appendChild(e);
    }
    [['26', '#1D4ED8'], ['9', '#EFF6FF']].forEach(function (c) {
      var o = document.createElementNS(SVGNS, 'circle'); o.setAttribute('r', c[0]); o.setAttribute('fill', c[1]); g.appendChild(o);
    });
    s.appendChild(g); return s;
  }
  document.querySelectorAll('.mark-slot').forEach(function (el, i) { el.replaceWith(mark(i === 0 ? 26 : 22)); });

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }
  function initial(n) { n = String(n || '?').trim(); return n ? n[0].toUpperCase() : '?'; }
  function hue(n) { var h = 0; n = String(n || ''); for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360; return h; }
  function meta(p) { try { return JSON.parse(p.metadata || '{}'); } catch (e) { return {}; } }
  // Bloom 那边进房间的两个身份（主持人的麦克风、Claude 的声音）：参会人里已经有了，不再列一遍，只用来亮"在说话"
  function isBloom(p) { return !!meta(p).bloom_host; }
  // 访客的头像：每人一个颜色，同一场里不重样（主持人、Claude 用自己的图）
  var PALETTE = ['#4ade80', '#facc15', '#f472b6', '#22d3ee', '#c084fc', '#f87171', '#2dd4bf', '#a3e635', '#e879f9', '#fbbf24'];   // 亮色，避开主持人的蓝和 Claude 的橙
  var colorOf = {}, nextColor = 0;
  function guestColor(name) {
    var given = state && state.colors && state.colors[name];   // 主持人那边定的颜色：和桌面端一样
    if (given) return given;
    if (!colorOf[name]) { colorOf[name] = PALETTE[nextColor % PALETTE.length]; nextColor++; }
    return colorOf[name];
  }
  function flower(color) {
    var s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('viewBox', '0 0 240 240'); s.setAttribute('width', '100%'); s.setAttribute('height', '100%'); s.setAttribute('aria-hidden', 'true');
    var g = document.createElementNS(SVGNS, 'g'); g.setAttribute('transform', 'translate(120,120) scale(.82)');
    for (var k = 0; k < 5; k++) {
      var e = document.createElementNS(SVGNS, 'ellipse');
      e.setAttribute('cy', '-46'); e.setAttribute('rx', '22'); e.setAttribute('ry', '40'); e.setAttribute('fill', color);
      e.setAttribute('opacity', k % 2 === 0 ? '1' : '.78'); e.setAttribute('transform', 'rotate(' + k * 72 + ')');
      g.appendChild(e);
    }
    var c1 = document.createElementNS(SVGNS, 'circle'); c1.setAttribute('r', '26'); c1.setAttribute('fill', color); c1.setAttribute('opacity', '.55'); g.appendChild(c1);
    var c2 = document.createElementNS(SVGNS, 'circle'); c2.setAttribute('r', '9'); c2.setAttribute('fill', '#fff'); c2.setAttribute('opacity', '.9'); g.appendChild(c2);
    s.appendChild(g); return s;
  }
  function avatar(name, url, small) {
    var a = document.createElement('div'); a.className = 'av' + (small ? ' sm' : '');
    var letter = function () { a.classList.add('flower'); a.appendChild(flower(guestColor(name))); };
    if (url) {
      var img = document.createElement('img'); img.alt = ''; img.src = url; img.draggable = false;
      img.onerror = function () { img.remove(); letter(); };
      a.appendChild(img);
    } else letter();
    return a;
  }
  function chip(role) {
    var c = document.createElement('span');
    if (role === 'host') { c.className = 'chip host'; c.textContent = '主持人'; }
    else if (role === 'claude') { c.className = 'chip claude'; c.textContent = 'Claude'; }
    else { c.className = 'chip'; c.textContent = '参会者'; }
    return c;
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function when(iso) { var d = new Date(iso); return isNaN(d) ? '' : (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function hm(iso) { var d = new Date(iso); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  if (!ROOM) { loaded = true; $('#j-go').disabled = true; $('#j-pill').classList.add('hidden'); setTimeout(render, 0); }   // 没有房间号：首页，只说用邀请链接进会
  $('#j-name').value = qs.get('name') || store('bloom.name') || '';
  $('#j-mic').checked = store('bloom.mic') !== '0';   // 默认开麦：没碰过开关的新访客进会就能说话（2026-11-14：默认不勾，旁边又写"进会时静音"，被当成"要不要静音"，没勾也静音进会）
  function micHint() { $('#j-mic-t').textContent = $('#j-mic').checked ? '大家能听到你' : '进会后先静音，随时可以打开'; }
  $('#j-mic').addEventListener('change', micHint); micHint();

  // ---------- 会议信息：从中继轮询 ----------
  function poll() {
    if (!ROOM) return;
    fetch('/view/' + encodeURIComponent(ROOM) + '/state?sv=' + sv, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.same || !loaded) { state = d.state || null; sv = d.sv; loaded = true; render(); }
        if (d.pv !== pv) { pv = d.pv; loadPaper(); }
      })
      .catch(function () {})
      .then(function () { setTimeout(poll, document.hidden ? 4000 : 1200); });
  }
  function phase() { return !loaded ? 'loading' : !state ? 'invalid' : state.live ? 'live' : state.upcoming ? 'wait' : 'ended'; }

  // 会议里的人：主持人、Claude（从 Bloom 推来的），再加上从链接进来的人
  function people() {
    var s = state || {}, talking = {}, out = [];
    if (room) Array.from(room.remoteParticipants.values()).forEach(function (p) { if (isBloom(p) && p.isSpeaking) talking[meta(p).role] = true; });
    var a = s.assistant || null;
    (s.people || []).forEach(function (p) {
      var isClaude = p.role === 'student';
      var sub = '';
      if (isClaude && a) sub = [a.dialog, a.edit].filter(Boolean).join('\n');   // 两个模型名各占一行，不加"对话""改稿"
      out.push({ name: p.name, avatar: p.avatar || null, role: isClaude ? 'claude' : p.role === 'teacher' ? 'host' : 'guest', sub: sub, speaking: !!talking[p.role] });
    });
    if (room) {
      [room.localParticipant].concat(Array.from(room.remoteParticipants.values()).filter(function (p) { return !isBloom(p); })).forEach(function (p) {
        var mine = p === room.localParticipant;
        out.push({ name: (p.name || p.identity), avatar: null, role: meta(p).role === 'teacher' ? 'teacher' : 'guest', sub: mine ? '我' : '', speaking: p.isSpeaking });
      });
    }
    return out;
  }
  function fillPeople(ul, list, detail) {
    ul.innerHTML = '';
    var a = (state && state.assistant) || null;
    list.forEach(function (p) {
      var li = document.createElement('li'); li.className = 'prow' + (p.speaking ? ' speaking' : '');
      li.appendChild(avatar(p.name, p.avatar));
      var nm = document.createElement('div'); nm.className = 'nm';
      var b = document.createElement('b'); b.textContent = p.name; nm.appendChild(b);
      b.style.color = p.role === 'host' ? '#60a5fa' : p.role === 'claude' ? '#e3906f' : guestColor(p.name);
      if (p.sub && !(detail && p.role === 'claude' && a && claudeOpen)) { var sp = document.createElement('span'); sp.textContent = p.sub; nm.appendChild(sp); }
      li.appendChild(nm); li.appendChild(chip(p.role));
      var fold = detail && p.role === 'claude' && a;
      if (fold) {
        li.className += ' claude-row' + (claudeOpen ? ' open' : '');
        li.setAttribute('role', 'button'); li.setAttribute('aria-expanded', claudeOpen ? 'true' : 'false');
        var ch = document.createElement('span'); ch.className = 'chev'; ch.setAttribute('aria-hidden', 'true');
        ch.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
        li.appendChild(ch);
        li.addEventListener('click', function () { claudeOpen = !claudeOpen; renderPeople(); });
      }
      ul.appendChild(li);
      // 会里看 Claude 的卡片：四行写全（对话、改稿、语音合成、语音识别）；手机上默认收起，点一下展开

  // ---------- 麦克风音量条：拿自己那一路麦克风的音量，按钮上三根条跟着跳 ----------

  function meterStop() {

  // ---------- 诊断：语音断开、重连、页面切走这些事报给中继记一行日志（下次知道访客为什么掉线；不带 token） ----------
  var myName = '', T0 = 0, diagLeft = 400, lastQ = '', lastQSent = '', lastQAt = 0;

  // ---------- 语音：进会、掉线自动重进（拿新 token，1 / 2 / 4 秒退避，最多 6 次），麦克风照断之前的样子 ----------
  var wantMic = false, micLater = false, quietUntil = 0, RJ_MAX = 6;

  function tokenFor(name) {

      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) { var e = new Error(d.error || ('HTTP ' + r.status)); e.tokenStatus = r.status; throw e; }

    r.on(RE.ParticipantConnected, function (p) { if (mine() && !isBloom(p) && Date.now() > quietUntil) toast((p.name || p.identity) + ' 进来了'); renderPeople(); })
      .on(RE.ParticipantDisconnected, function (p) { if (mine() && !isBloom(p)) toast((p.name || p.identity) + ' 离开了'); renderPeople(); })
      .on(RE.ActiveSpeakersChanged, renderPeople)

  $('#r-conn-b').addEventListener('click', function () {   // 手动「重新连接」

  });
  function leave(cause) {

  // 页面切走 / 回来：报一下（访客掉线多半在这时候）；回来时语音还断着就马上重进，麦克风该开就开

  });
  window.addEventListener('pagehide', function (e) { if (joined) diag('pagehide', e.persisted ? 'persisted' : ''); });
  window.addEventListener('pageshow', function (e) { if (joined && e.persisted) { diag('pageshow', 'persisted'); wake(); } });
  document.addEventListener('freeze', function () { if (joined) diag('freeze'); });
  document.addEventListener('resume', function () { if (joined) { diag('resume'); wake(); } });
  poll();
})();
</script>
</body>
</html>
